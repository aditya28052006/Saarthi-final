# SAARTHI Spring Boot Application Properties
server.port=5000
spring.application.name=saarthi-backend

# Static Resource Configuration
spring.web.resources.static-locations=classpath:/static/,file:./static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging
logging.level.com.saarthi=INFO
logging.level.org.springframework.web=INFO

# P0 freshness / path robustness (optional, commented out = packaged classpath copies).
# Point at a refreshed NB06 package to serve it without rebuilding the jar, then call
# POST /api/forecast/reload (forecast) or POST /api/climate-context/reload (climate).
# Example: -Dsaarthi.forecast.path=C:/data/saarthi/application -Dsaarthi.climate.path=C:/data/saarthi/climate_context
# saarthi.forecast.path=
# saarthi.climate.path=

# Live weather (Open-Meteo delivery + ECMWF IFS NWP). No API key or secret:
# the prototype endpoint is keyless. Never commit secrets here.
# saarthi.weather.base-url defaults to https://api.open-meteo.com
# saarthi.weather.base-url=
# saarthi.weather.timeout-seconds=25
# saarthi.weather.cache-ttl-minutes=60
# Optional: point at the local CHIRPS block CSV to enable observed_last_*_mm
# (recent observed rainfall, kept strictly separate from forecast fields).
# Example: -Dsaarthi.chirps.path=C:/data/saarthi/Sangrur_Block_Daily_Rainfall_2010_2025.csv
# saarthi.chirps.path=

# Live IFS shadow validation (Phase 4.x data-collection layer, additive).
# One immutable JSONL record per (issue, block) is appended on every fresh
# live forecast; truth (CHIRPS D+1..D+7) is attached later by
# `python -m src.shadow.truth`. Capture is fail-soft: storage failure never
# breaks /api/weather/*. Blank = repo-canonical
# <repo>/data/processed/shadow/ifs_shadow.jsonl (resolved from the module dir).
# saarthi.shadow.path=

# FIELD_HIGH live shadow (Phase 4.3 data-collection layer, additive, separate
# ledger). Truth (CHIRPS D+1..D+3 wet count >= 2) is attached later by
# `python -m src.shadow.field_shadow`. Blank = repo-canonical
# <repo>/data/processed/shadow/field_shadow.jsonl. Dry-spell ledger untouched.
# saarthi.fieldshadow.path=

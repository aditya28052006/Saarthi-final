# SAARTHI Spring Boot Application Properties
server.port=5000
spring.application.name=saarthi-backend

# Static Resource Configuration
spring.web.resources.static-locations=classpath:/static/,file:./static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging
logging.level.com.saarthi=INFO
logging.level.org.springframework.web=INFO

# P0 freshness / path robustness (optional, commented out = packaged classpath copies).
# Point at a refreshed NB06 package to serve it without rebuilding the jar, then call
# POST /api/forecast/reload (forecast) or POST /api/climate-context/reload (climate).
# Example: -Dsaarthi.forecast.path=C:/data/saarthi/application -Dsaarthi.climate.path=C:/data/saarthi/climate_context
# saarthi.forecast.path=
# saarthi.climate.path=
